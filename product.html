<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Товар — KICKS.UA</title>
<meta id="metaDescription" name="description" content="Оригінальне взуття з доставкою по Україні">
<meta id="ogTitle" property="og:title" content="KICKS.UA">
<meta id="ogDescription" property="og:description" content="Оригінальне взуття з доставкою по Україні">
<meta id="ogImage" property="og:image" content="">
<meta property="og:type" content="product">
<script type="application/ld+json" id="productSchema"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap');
  :root{
    --canvas:#EDE9E1;--asphalt:#232320;--sole:#8A8578;--cone:#FF4B12;--chalk:#FAF8F3;--stitch:#C9C2B2;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--canvas);color:var(--asphalt);font-family:'Archivo',sans-serif;overflow-x:hidden;}
  a{color:inherit;}
  .label{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--sole);}

  .lace-divider{
    height:24px;width:100%;
    background-image: repeating-linear-gradient(-55deg, var(--asphalt) 0px, var(--asphalt) 3px, transparent 3px, transparent 22px);
    opacity:0.85;
  }

  nav{
    display:flex;justify-content:space-between;align-items:center;padding:20px 6%;
    position:sticky;top:0;background:var(--canvas);z-index:50;border-bottom:2px solid var(--asphalt);
  }
  .logo{font-family:'Archivo Black',sans-serif;font-size:21px;letter-spacing:-0.02em;text-decoration:none;color:var(--asphalt);}
  .logo span{color:var(--cone);}
  .nav-links{display:flex;gap:20px;align-items:center;}
  .nav-links a{font-family:'JetBrains Mono',monospace;font-size:13px;text-decoration:none;color:var(--asphalt);}
  .nav-cta{
    background:var(--cone);color:var(--chalk);padding:11px 20px;font-weight:700;
    display:inline-flex;align-items:center;gap:6px;border:2px solid var(--asphalt);
    box-shadow:3px 3px 0 var(--asphalt);transition:transform 0.15s, box-shadow 0.15s;
  }
  .nav-cta:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--asphalt);background:var(--asphalt);}
  .cart-link{display:inline-flex;align-items:center;gap:6px;}
  .cart-badge{
    display:none;align-items:center;justify-content:center;
    background:var(--cone);color:var(--chalk);border-radius:50%;
    width:18px;height:18px;font-size:10.5px;font-weight:700;
  }

  .promo-banner{
    background:var(--asphalt);color:var(--chalk);
    padding:10px 6%;display:flex;justify-content:center;gap:10px;align-items:center;
    font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:0.04em;
    flex-wrap:wrap;text-align:center;
  }
  .promo-banner .cone-text{color:var(--cone);font-weight:700;}

  .breadcrumb{padding:16px 6% 0;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--sole);}
  .breadcrumb a{text-decoration:none;color:var(--sole);border-bottom:1px solid var(--stitch);}

  .hero{display:grid;grid-template-columns:1fr 1.1fr;align-items:start;padding:36px 6% 46px;gap:36px;}

  .gallery-main{
    width:100%;aspect-ratio:1/1;background:#fff;border:2px solid var(--asphalt);
    display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:12px;padding:20px;
  }
  .gallery-main img{width:100%;height:100%;object-fit:contain;}
  .gallery-main svg{width:100%;height:100%;}
  .gallery-thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .gallery-thumbs img{
    width:100%;aspect-ratio:1/1;object-fit:cover;background:#fff;
    border:1.5px solid var(--stitch);cursor:pointer;transition:border-color 0.15s;
  }
  .gallery-thumbs img:hover, .gallery-thumbs img.active{border-color:var(--cone);border-width:2px;}

  h1.product-title{
    font-family:'Archivo Black',sans-serif;font-size:clamp(26px,3.6vw,42px);
    line-height:1.02;letter-spacing:-0.02em;margin:12px 0 16px;
  }
  .price-tag{display:inline-flex;align-items:baseline;gap:10px;margin-bottom:20px;}
  .price-tag .old{font-family:'JetBrains Mono',monospace;text-decoration:line-through;color:var(--sole);font-size:16px;}
  .price-tag .new{font-family:'Archivo Black',sans-serif;font-size:28px;color:var(--cone);}
  .desc{font-size:15px;color:#4a483f;margin-bottom:20px;line-height:1.6;}

  .specs{background:var(--chalk);border:1.5px solid var(--stitch);padding:18px 20px;margin-bottom:20px;display:none;}
  .specs.visible{display:block;}
  .specs .row{display:flex;justify-content:space-between;padding:7px 0;font-size:13.5px;border-bottom:1px solid var(--stitch);gap:12px;}
  .specs .row:last-child{border-bottom:none;}
  .specs .row .k{color:var(--sole);font-family:'JetBrains Mono',monospace;font-size:12px;white-space:nowrap;}
  .specs .row .v{font-weight:600;text-align:right;}

  .size-chart{
    background:var(--canvas);border:1.5px dashed var(--stitch);padding:14px 18px;margin-bottom:22px;
    font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#4a483f;display:none;
  }
  .size-chart.visible{display:block;}

  .size-picker{margin-bottom:24px;}
  .size-picker .label{margin-bottom:10px;display:block;}
  .size-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .size-grid button{
    min-width:52px;padding:11px 8px;border:2px solid var(--asphalt);background:var(--chalk);
    font-family:'JetBrains Mono',monospace;font-size:13.5px;cursor:pointer;
  }
  .size-grid button:hover, .size-grid button.active{background:var(--asphalt);color:var(--chalk);}

  .btn-primary{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;text-align:center;font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;letter-spacing:0.04em;
    background:var(--cone);color:var(--chalk);padding:24px 32px;text-decoration:none;
    border:3px solid var(--asphalt);box-shadow:7px 7px 0 var(--asphalt);
    transition:transform 0.15s, box-shadow 0.15s;cursor:pointer;margin-bottom:12px;
    animation: subtle-pulse 2.5s ease-in-out infinite;
  }
  @keyframes subtle-pulse{0%,100%{box-shadow:7px 7px 0 var(--asphalt);}50%{box-shadow:7px 7px 0 var(--asphalt), 0 0 0 4px rgba(255,75,18,0.15);}}
  .btn-primary:hover{transform:translate(3px,3px);box-shadow:4px 4px 0 var(--asphalt);animation:none;}
  .btn-secondary{
    display:block;width:100%;text-align:center;font-family:'JetBrains Mono',monospace;font-size:13.5px;letter-spacing:0.03em;
    background:transparent;color:var(--asphalt);padding:14px 28px;text-decoration:none;
    border:2px solid var(--asphalt);cursor:pointer;
  }
  .btn-secondary:hover{background:var(--asphalt);color:var(--chalk);}
  .added-toast{
    display:none;background:var(--asphalt);color:var(--chalk);padding:12px 18px;margin-bottom:18px;
    font-family:'JetBrains Mono',monospace;font-size:13px;
  }
  .added-toast.visible{display:block;}

  .trust-strip{
    display:flex;justify-content:space-between;padding:18px 6%;
    background:var(--asphalt);color:var(--chalk);flex-wrap:wrap;gap:14px;
  }
  .trust-strip div{font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:0.02em;display:flex;align-items:center;gap:8px;}
  .trust-strip div::before{content:"—";color:var(--cone);}

  .related{padding:16px 6% 60px;}
  .related h2{font-family:'Archivo Black',sans-serif;font-size:22px;padding:30px 0 20px;}
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:2px;background:var(--stitch);
    border-top:2px solid var(--asphalt);border-bottom:2px solid var(--asphalt);
  }
  .card{
    background:var(--chalk);padding:20px 18px 22px;text-decoration:none;color:var(--asphalt);
    display:flex;flex-direction:column;transition:background 0.15s;
  }
  .card:hover{background:#fff;}
  .card .thumb{
    width:100%;aspect-ratio:1/1;background:var(--canvas);
    border:2px solid var(--asphalt);margin-bottom:14px;
    display:flex;align-items:center;justify-content:center;overflow:hidden;padding:14px;
  }
  .card .brand-tag{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--sole);letter-spacing:0.05em;text-transform:uppercase;margin-bottom:4px;}
  .card h3{font-size:15.5px;font-weight:700;margin-bottom:6px;}
  .card .price{font-family:'JetBrains Mono',monospace;font-size:15.5px;color:var(--cone);margin-top:auto;padding-top:8px;font-weight:700;}

  .not-found{padding:80px 6%;text-align:center;}
  .not-found h2{font-family:'Archivo Black',sans-serif;font-size:28px;margin-bottom:14px;}

  footer{
    padding:32px 6%;display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;gap:12px;border-top:2px solid var(--asphalt);
  }
  footer .foot-links{display:flex;gap:20px;font-family:'JetBrains Mono',monospace;font-size:12px;}
  footer .foot-links a{color:var(--asphalt);text-decoration:none;border-bottom:1px solid var(--stitch);}

  @media (max-width:760px){
    .hero{grid-template-columns:1fr;}
    .trust-strip{flex-direction:column;}
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">KICKS<span>.UA</span></a>
  <div class="nav-links">
    <a href="index.html">Каталог</a>
    <a href="favorites.html" class="cart-link">♥ Обране <span class="cart-badge" id="favBadge">0</span></a>
    <a href="cart.html" class="cart-link">Кошик <span class="cart-badge" id="cartBadge">0</span></a>
    <a href="delivery.html">Доставка</a>
    <a href="https://t.me/твій_нік_тут" class="nav-cta">💬 Написати нам</a>
  </div>
</nav>
<div class="promo-banner">🔥 <span class="cone-text">Знижка тижня</span> — до −16% на топ-моделі · оплата при отриманні · доставка по всій Україні</div>

<div id="pageContent">
  <div class="not-found"><h2>Завантаження...</h2></div>
</div>

<footer>
  <div class="logo">KICKS<span>.UA</span></div>
  <div class="foot-links">
    <a href="https://t.me/твій_нік_тут">Telegram-канал</a>
    <a href="delivery.html">Доставка і оплата</a>
  </div>
</footer>

<script>
  function shoeSvgHTML(body, accent) {
    const stroke = "#232320";
    return `<svg viewBox="0 0 500 320" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="250" cy="290" rx="200" ry="16" fill="${stroke}" opacity="0.08"/>
      <path d="M40 230 Q30 180 90 165 Q110 120 170 110 Q230 95 280 115 L440 150 Q470 158 468 190 Q465 225 420 232 L70 245 Q45 245 40 230 Z" fill="${body}" stroke="${stroke}" stroke-width="4"/>
      <path d="M40 230 Q60 250 100 248 L440 232 Q470 225 468 190" fill="#8A8578" stroke="${stroke}" stroke-width="4"/>
      <path d="M170 110 Q230 95 280 115 L320 150 L150 155 Z" fill="${accent}" stroke="${stroke}" stroke-width="4"/>
      <line x1="185" y1="130" x2="150" y2="160" stroke="${stroke}" stroke-width="3"/>
      <line x1="210" y1="120" x2="175" y2="158" stroke="${stroke}" stroke-width="3"/>
      <line x1="235" y1="114" x2="205" y2="158" stroke="${stroke}" stroke-width="3"/>
      <line x1="260" y1="115" x2="238" y2="158" stroke="${stroke}" stroke-width="3"/>
      <circle cx="150" cy="160" r="4" fill="${stroke}"/>
      <circle cx="175" cy="158" r="4" fill="${stroke}"/>
      <circle cx="205" cy="158" r="4" fill="${stroke}"/>
      <circle cx="238" cy="158" r="4" fill="${stroke}"/>
      <circle cx="185" cy="130" r="4" fill="${stroke}"/>
      <circle cx="210" cy="120" r="4" fill="${stroke}"/>
      <circle cx="235" cy="114" r="4" fill="${stroke}"/>
      <circle cx="260" cy="115" r="4" fill="${stroke}"/>
    </svg>`;
  }

  function productThumbHTML(product) {
    if (product.images && product.images.length > 0) {
      return `<img src="${product.images[0]}" style="width:100%;height:100%;object-fit:cover;" alt="${product.name}">`;
    }
    const c = product.placeholderColor || { body: "#EDE9E1", accent: "#8A8578" };
    return shoeSvgHTML(c.body, c.accent);
  }

  (function(){
    try {
      var cart = JSON.parse(localStorage.getItem('kicksCart') || '[]');
      var badge = document.getElementById('cartBadge');
      if (cart.length > 0) { badge.textContent = cart.length; badge.style.display = 'inline-flex'; }
    } catch(e) {}
    try {
      var favs = JSON.parse(localStorage.getItem('kicksFavorites') || '[]');
      var favBadge = document.getElementById('favBadge');
      if (favs.length > 0) { favBadge.textContent = favs.length; favBadge.style.display = 'inline-flex'; }
    } catch(e) {}
  })();

  const params = new URLSearchParams(window.location.search);
  const productId = params.get('id');

  async function init() {
    const contentDiv = document.getElementById('pageContent');
    try {
      const res = await fetch('products.json?_=' + Date.now());
      const products = await res.json();
      const product = products.find(p => p.id === productId);

      if (!product) {
        contentDiv.innerHTML = `
          <div class="not-found">
            <h2>Товар не знайдено</h2>
            <p style="color:var(--sole);margin-bottom:20px;">Можливо, він більше не доступний.</p>
            <a href="index.html" class="label" style="text-decoration:underline;">← Повернутись до каталогу</a>
          </div>`;
        return;
      }

      document.getElementById('pageTitle').textContent = `${product.brand} ${product.name} — KICKS.UA`;

      // SEO: заповнюємо meta-теги та structured data для пошукових систем
      const seoDescription = (product.description || `${product.brand} ${product.name} — оригінальне взуття з доставкою по Україні.`).slice(0, 160);
      document.getElementById('metaDescription').setAttribute('content', seoDescription);
      document.getElementById('ogTitle').setAttribute('content', `${product.brand} ${product.name} — KICKS.UA`);
      document.getElementById('ogDescription').setAttribute('content', seoDescription);
      if (product.images && product.images.length > 0) {
        document.getElementById('ogImage').setAttribute('content', new URL(product.images[0], window.location.href).href);
      }
      document.getElementById('productSchema').textContent = JSON.stringify({
        "@context": "https://schema.org/",
        "@type": "Product",
        "name": `${product.brand} ${product.name}`,
        "description": seoDescription,
        "brand": { "@type": "Brand", "name": product.brand },
        "image": (product.images || []).map(img => new URL(img, window.location.href).href),
        "offers": {
          "@type": "Offer",
          "priceCurrency": "UAH",
          "price": product.price,
          "availability": product.stock === 0 ? "https://schema.org/OutOfStock" : "https://schema.org/InStock"
        }
      });

      const hasRealImages = product.images && product.images.length > 0;
      const mainImageHtml = hasRealImages
        ? `<img src="${product.images[0]}" id="mainImage" alt="${product.name}">`
        : `<div id="mainImage" style="width:100%;height:100%;">${productThumbHTML(product)}</div>`;

      const thumbsHtml = hasRealImages ? `
        <div class="gallery-thumbs" id="galleryThumbs">
          ${product.images.map((img, i) => `<img src="${img}" class="${i === 0 ? 'active' : ''}" data-full="${img}">`).join('')}
        </div>` : '';

      const oldPriceHtml = product.oldPrice ? `<span class="old">${product.oldPrice} ₴</span>` : '';

      const specsEntries = product.specs ? Object.entries(product.specs) : [];
      const specsHtml = specsEntries.length > 0 ? `
        <div class="specs visible">
          ${specsEntries.map(([k, v]) => `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}
        </div>` : '';

      const sizeChartHtml = product.sizeChart ? `<div class="size-chart visible"><span class="label" style="display:block;margin-bottom:6px;">Розмірна сітка</span>${product.sizeChart}</div>` : '';

      const sizesHtml = product.sizes.map((s, i) =>
        `<button type="button" class="size-btn${i === 0 ? ' active' : ''}" data-size="${s}">${s}</button>`
      ).join('\n');

      contentDiv.innerHTML = `
        <div class="breadcrumb"><a href="index.html">Каталог</a> / ${product.brand} ${product.name}</div>
        <section class="hero">
          <div class="gallery">
            <div class="gallery-main">${mainImageHtml}</div>
            ${thumbsHtml}
          </div>
          <div class="hero-copy">
            <span class="label">${product.brand} · Оригінал</span>
            <h1 class="product-title">${product.name}</h1>
            <div class="price-tag">${oldPriceHtml}<span class="new">${product.price} ₴</span></div>
            <p class="desc">${product.description || ''}</p>
            ${specsHtml}
            ${sizeChartHtml}
            <div class="size-picker">
              <span class="label">Розмір (EU)</span>
              <div class="size-grid" id="sizeGrid">${sizesHtml}</div>
            </div>
            <div class="added-toast" id="addedToast">✓ Додано в кошик — <a href="cart.html" style="color:var(--cone);text-decoration:underline;">перейти до кошика</a></div>
            <div style="display:flex;gap:10px;margin-bottom:12px;">
              <button type="button" class="btn-primary" id="addToCartBtn" style="margin-bottom:0;flex:1;">🛒 ДОДАТИ В КОШИК</button>
              <button type="button" id="favToggleBtn" title="Додати в обране" style="width:60px;flex-shrink:0;border:3px solid var(--asphalt);background:var(--chalk);cursor:pointer;font-size:20px;">♡</button>
            </div>
            <a href="cart.html" class="btn-secondary">Переглянути кошик →</a>
          </div>
        </section>
        <div class="lace-divider"></div>
        <div class="trust-strip">
          <div>Оригінал, документи від дистриб'ютора</div>
          <div>Оплата при отриманні</div>
          <div>Обмін розміру безкоштовно</div>
        </div>
        <section class="related">
          <h2>Схожі моделі</h2>
          <div class="grid" id="relatedGrid"></div>
        </section>
      `;

      // gallery clicks
      if (hasRealImages) {
        document.querySelectorAll('#galleryThumbs img').forEach(thumb => {
          thumb.addEventListener('click', function(){
            document.querySelectorAll('#galleryThumbs img').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            document.getElementById('mainImage').src = this.dataset.full;
          });
        });
      }

      // size selection
      let selectedSize = product.sizes[0];
      document.querySelectorAll('.size-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          selectedSize = this.dataset.size;
        });
      });

      // add to cart
      document.getElementById('addToCartBtn').addEventListener('click', function() {
        try {
          let cart = [];
          try { cart = JSON.parse(localStorage.getItem('kicksCart') || '[]'); } catch(e) { cart = []; }
          cart.push({
            productId: product.id,
            size: selectedSize,
            cartItemId: Date.now() + Math.random()
          });
          localStorage.setItem('kicksCart', JSON.stringify(cart));
          const toast = document.getElementById('addedToast');
          toast.classList.add('visible');
          setTimeout(() => toast.classList.remove('visible'), 4000);
          const badge = document.getElementById('cartBadge');
          badge.textContent = cart.length;
          badge.style.display = 'inline-flex';
        } catch (err) {
          console.error('Помилка додавання в кошик:', err);
          alert('Не вдалося додати товар у кошик. Можливо, у браузері вимкнено localStorage (приватний режим?). Помилка: ' + err.message);
        }
      });

      // favorites toggle
      function getFavorites() {
        try { return JSON.parse(localStorage.getItem('kicksFavorites') || '[]'); } catch(e) { return []; }
      }
      const favBtn = document.getElementById('favToggleBtn');
      function refreshFavBtn() {
        const isFav = getFavorites().includes(product.id);
        favBtn.textContent = isFav ? '♥' : '♡';
        favBtn.style.background = isFav ? 'var(--cone)' : 'var(--chalk)';
        favBtn.style.color = isFav ? 'var(--chalk)' : 'var(--asphalt)';
      }
      refreshFavBtn();
      favBtn.addEventListener('click', function() {
        let favs = getFavorites();
        if (favs.includes(product.id)) {
          favs = favs.filter(id => id !== product.id);
        } else {
          favs.push(product.id);
        }
        localStorage.setItem('kicksFavorites', JSON.stringify(favs));
        refreshFavBtn();
        const favBadge = document.getElementById('favBadge');
        if (favs.length > 0) { favBadge.textContent = favs.length; favBadge.style.display = 'inline-flex'; }
        else { favBadge.style.display = 'none'; }
      });

      // related products
      const related = products.filter(p => p.id !== product.id && p.active !== false).slice(0, 3);
      document.getElementById('relatedGrid').innerHTML = related.map(p => {
        const oldHtml = p.oldPrice ? `<span class="old">${p.oldPrice} ₴</span>` : '';
        return `
          <a href="product.html?id=${encodeURIComponent(p.id)}" class="card">
            <div class="thumb">${productThumbHTML(p)}</div>
            <div class="brand-tag">${p.brand}</div>
            <h3>${p.name}</h3>
            <div class="price">${oldHtml}${p.price} ₴</div>
          </a>`;
      }).join('');

    } catch (err) {
      contentDiv.innerHTML = `<div class="not-found"><h2>Помилка завантаження</h2><p style="color:var(--sole);">${err.message}</p></div>`;
    }
  }

  init();
</script>

</body>
</html>
