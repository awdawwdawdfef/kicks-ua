<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Політика конфіденційності — KICKS.UA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap');
  :root{--canvas:#EDE9E1;--asphalt:#232320;--sole:#8A8578;--cone:#FF4B12;--chalk:#FAF8F3;--stitch:#C9C2B2;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--canvas);color:var(--asphalt);font-family:'Archivo',sans-serif;}
  a{color:inherit;}
  .label{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--sole);}
  nav{
    display:flex;justify-content:space-between;align-items:center;padding:20px 6%;
    position:sticky;top:0;background:var(--canvas);z-index:50;border-bottom:2px solid var(--asphalt);
  }
  .logo{font-family:'Archivo Black',sans-serif;font-size:21px;text-decoration:none;color:var(--asphalt);}
  .logo span{color:var(--cone);}
  .nav-links{display:flex;gap:16px;align-items:center;}
  .nav-links a{font-family:'JetBrains Mono',monospace;font-size:13px;text-decoration:none;color:var(--asphalt);}
  .nav-cta{
    background:var(--cone);color:var(--chalk);padding:11px 20px;font-weight:700;
    display:inline-flex;align-items:center;gap:6px;border:2px solid var(--asphalt);
    box-shadow:3px 3px 0 var(--asphalt);transition:transform 0.15s, box-shadow 0.15s;
  }
  .nav-cta:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--asphalt);background:var(--asphalt);}
  .cart-link{display:inline-flex;align-items:center;gap:6px;}
  .cart-badge{
    display:none;align-items:center;justify-content:center;
    background:var(--cone);color:var(--chalk);border-radius:50%;
    width:18px;height:18px;font-size:10.5px;font-weight:700;
  }
  .head{padding:56px 6% 36px;}
  .head h1{font-family:'Archivo Black',sans-serif;font-size:clamp(30px,4.6vw,48px);line-height:1.02;letter-spacing:-0.02em;}

  .policy-text{
    padding:0 6% 60px;max-width:720px;color:#4a483f;line-height:1.7;font-size:15px;white-space:pre-line;
  }
  .loading-msg{padding:0 6% 40px;font-family:'JetBrains Mono',monospace;color:var(--sole);}

  footer{padding:32px 6%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-top:2px solid var(--asphalt);}
  footer .foot-links{display:flex;gap:20px;font-family:'JetBrains Mono',monospace;font-size:12px;flex-wrap:wrap;}
  footer .foot-links a{color:var(--asphalt);text-decoration:none;border-bottom:1px solid var(--stitch);}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">KICKS<span>.UA</span></a>
  <div class="nav-links">
    <a href="index.html">Каталог</a>
    <a href="cart.html" class="cart-link">Кошик <span class="cart-badge" id="cartBadge">0</span></a>
    <a href="delivery.html">Доставка</a>
    <a href="#" id="managerCtaLink" class="nav-cta" target="_blank">💬 Написати нам</a>
  </div>
</nav>

<section class="head">
  <span class="label">Юридична інформація</span>
  <h1>Політика<br>конфіденційності</h1>
</section>

<div class="policy-text" id="policyText">Завантаження...</div>

<footer>
  <div class="logo">KICKS<span>.UA</span></div>
  <div class="foot-links">
    <a href="#" id="footerTelegramLink" target="_blank">Telegram-канал</a>
    <a href="delivery.html">Доставка і оплата</a>
    <a href="contacts.html">Контакти</a>
    <a href="privacy.html">Політика конфіденційності</a>
  </div>
</footer>

<script>
  (function(){
    try {
      var cart = JSON.parse(localStorage.getItem('kicksCart') || '[]');
      var badge = document.getElementById('cartBadge');
      if (cart.length > 0) { badge.textContent = cart.length; badge.style.display = 'inline-flex'; }
    } catch(e) {}
  })();

  async function renderPolicy() {
    const area = document.getElementById('policyText');
    try {
      const res = await fetch('site-content.json?_=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();

      if (data.contacts && data.contacts.telegramHandle) {
        const tgUrl = 'https://t.me/' + data.contacts.telegramHandle;
        const managerBtn = document.getElementById('managerCtaLink');
        const footerLink = document.getElementById('footerTelegramLink');
        if (managerBtn) managerBtn.href = tgUrl;
        if (footerLink) footerLink.href = tgUrl;
      }

      area.textContent = data.privacyPolicyText || 'Політика конфіденційності поки не заповнена.';
    } catch (err) {
      area.textContent = 'Не вдалося завантажити текст політики.';
    }
  }

  renderPolicy();
</script>

</body>
</html>
