<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Обране — KICKS.UA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap');
  :root{
    --canvas:#EDE9E1;--asphalt:#232320;--sole:#8A8578;--cone:#FF4B12;--chalk:#FAF8F3;--stitch:#C9C2B2;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--canvas);color:var(--asphalt);font-family:'Archivo',sans-serif;}
  a{color:inherit;}
  .label{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--sole);}
  nav{
    display:flex;justify-content:space-between;align-items:center;padding:20px 6%;
    position:sticky;top:0;background:var(--canvas);z-index:50;border-bottom:2px solid var(--asphalt);
  }
  .logo{font-family:'Archivo Black',sans-serif;font-size:21px;text-decoration:none;color:var(--asphalt);}
  .logo span{color:var(--cone);}
  .nav-links{display:flex;gap:16px;align-items:center;}
  .nav-links a{font-family:'JetBrains Mono',monospace;font-size:13px;text-decoration:none;color:var(--asphalt);}
  .nav-cta{
    background:var(--cone);color:var(--chalk);padding:11px 20px;font-weight:700;
    display:inline-flex;align-items:center;gap:6px;border:2px solid var(--asphalt);
    box-shadow:3px 3px 0 var(--asphalt);transition:transform 0.15s, box-shadow 0.15s;
  }
  .nav-cta:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--asphalt);background:var(--asphalt);}
  .cart-link{display:inline-flex;align-items:center;gap:6px;}
  .cart-badge{
    display:none;align-items:center;justify-content:center;
    background:var(--cone);color:var(--chalk);border-radius:50%;
    width:18px;height:18px;font-size:10.5px;font-weight:700;
  }

  .fav-page{padding:50px 6% 80px;}
  .fav-page h1{
    font-family:'Archivo Black',sans-serif;font-size:clamp(30px,4.4vw,48px);
    letter-spacing:-0.02em;margin-bottom:30px;line-height:1.02;
  }
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:2px;background:var(--stitch);
    border-top:2px solid var(--asphalt);border-bottom:2px solid var(--asphalt);
  }
  .card{
    background:var(--chalk);padding:20px 18px 22px;text-decoration:none;color:var(--asphalt);
    display:flex;flex-direction:column;transition:background 0.15s;position:relative;
  }
  .card:hover{background:#fff;}
  .card .thumb{
    width:100%;aspect-ratio:1/1;background:var(--canvas);
    border:2px solid var(--asphalt);margin-bottom:14px;
    display:flex;align-items:center;justify-content:center;overflow:hidden;padding:14px;
  }
  .card .brand-tag{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--sole);letter-spacing:0.05em;text-transform:uppercase;margin-bottom:4px;}
  .card h3{font-size:15.5px;font-weight:700;margin-bottom:6px;}
  .card .price{font-family:'JetBrains Mono',monospace;font-size:15.5px;color:var(--cone);margin-top:auto;padding-top:8px;font-weight:700;}
  .remove-fav{
    position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;
    background:var(--asphalt);color:var(--chalk);border:none;cursor:pointer;font-size:14px;z-index:2;
  }
  .remove-fav:hover{background:#B23A2E;}

  .empty-state{
    background:var(--chalk);border:2px dashed var(--stitch);padding:50px 30px;text-align:center;
  }
  .empty-state p{color:var(--sole);margin-bottom:20px;font-size:15px;}
  .btn-outline{
    display:inline-block;font-family:'JetBrains Mono',monospace;font-size:13.5px;
    background:transparent;color:var(--asphalt);padding:14px 24px;text-decoration:none;
    border:2px solid var(--asphalt);
  }
  .btn-outline:hover{background:var(--asphalt);color:var(--chalk);}

  footer{padding:32px 6%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-top:2px solid var(--asphalt);}
  footer .foot-links{display:flex;gap:20px;font-family:'JetBrains Mono',monospace;font-size:12px;}
  footer .foot-links a{color:var(--asphalt);text-decoration:none;border-bottom:1px solid var(--stitch);}
  .banner-carousel{position:relative;margin:0 6% 24px;overflow:hidden;border:2px solid var(--asphalt);}
  .banner-track{display:flex;transition:transform 0.5s ease;}
  .banner-slide{min-width:100%;aspect-ratio:16/5;position:relative;text-decoration:none;display:block;}
  .banner-slide img{width:100%;height:100%;object-fit:cover;display:block;}
  .banner-slide .banner-title{
    position:absolute;bottom:0;left:0;right:0;padding:16px 20px;
    background:linear-gradient(transparent, rgba(35,35,32,0.85));
    color:var(--chalk);font-family:'Archivo Black',sans-serif;font-size:clamp(16px,2.4vw,24px);
  }
  .banner-dots{position:absolute;bottom:10px;right:16px;display:flex;gap:6px;}
  .banner-dots button{
    width:8px;height:8px;border-radius:50%;border:1.5px solid var(--chalk);background:transparent;
    cursor:pointer;padding:0;
  }
  .banner-dots button.active{background:var(--chalk);}
  @media (max-width:600px){.banner-slide{aspect-ratio:16/9;}}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">KICKS<span>.UA</span></a>
  <div class="nav-links">
    <a href="index.html">Каталог</a>
    <a href="cart.html" class="cart-link">Кошик <span class="cart-badge" id="cartBadge">0</span></a>
    <a href="#" id="managerCtaLink" class="nav-cta" target="_blank">💬 Написати нам</a>
  </div>
</nav>
<div class="banner-carousel" id="bannerCarousel" style="display:none;">
  <div class="banner-track" id="bannerTrack"></div>
  <div class="banner-dots" id="bannerDots"></div>
</div>

<section class="fav-page">
  <h1>♥ Обране</h1>
  <div id="favContent"><p class="label">Завантаження...</p></div>
</section>

<footer>
  <div class="logo">KICKS<span>.UA</span></div>
  <div class="foot-links">
    <a href="index.html">Каталог</a>
  </div>
</footer>

<script>
  function shoeSvgHTML(body, accent) {
    const stroke = "#232320";
    return `<svg viewBox="0 0 500 320" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="250" cy="290" rx="200" ry="16" fill="${stroke}" opacity="0.08"/>
      <path d="M40 230 Q30 180 90 165 Q110 120 170 110 Q230 95 280 115 L440 150 Q470 158 468 190 Q465 225 420 232 L70 245 Q45 245 40 230 Z" fill="${body}" stroke="${stroke}" stroke-width="4"/>
      <path d="M40 230 Q60 250 100 248 L440 232 Q470 225 468 190" fill="#8A8578" stroke="${stroke}" stroke-width="4"/>
      <path d="M170 110 Q230 95 280 115 L320 150 L150 155 Z" fill="${accent}" stroke="${stroke}" stroke-width="4"/>
    </svg>`;
  }
  function productThumbHTML(p) {
    if (p.images && p.images.length > 0) return `<img src="${p.images[0]}" style="width:100%;height:100%;object-fit:cover;" alt="${p.name}">`;
    const c = p.placeholderColor || { body: "#EDE9E1", accent: "#8A8578" };
    return shoeSvgHTML(c.body, c.accent);
  }

  (function(){
    try {
      var cart = JSON.parse(localStorage.getItem('kicksCart') || '[]');
      var badge = document.getElementById('cartBadge');
      if (cart.length > 0) { badge.textContent = cart.length; badge.style.display = 'inline-flex'; }
    } catch(e) {}
  })();

  function getFavorites() {
    try { return JSON.parse(localStorage.getItem('kicksFavorites') || '[]'); } catch(e) { return []; }
  }
  function removeFavorite(id) {
    const favs = getFavorites().filter(f => f !== id);
    localStorage.setItem('kicksFavorites', JSON.stringify(favs));
    render();
  }

  async function render() {
    const container = document.getElementById('favContent');
    const favIds = getFavorites();

    if (favIds.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <p>Список обраного порожній — натисни ♥ на будь-якому товарі в каталозі.</p>
          <a href="index.html" class="btn-outline">← До каталогу</a>
        </div>`;
      return;
    }

    try {
      const res = await fetch('products.json?_=' + Date.now());
      const products = await res.json();
      const favProducts = products.filter(p => favIds.includes(p.id));

      if (favProducts.length === 0) {
        container.innerHTML = `<div class="empty-state"><p>Товари з обраного більше не доступні.</p><a href="index.html" class="btn-outline">← До каталогу</a></div>`;
        return;
      }

      container.innerHTML = `<div class="grid">${favProducts.map(p => {
        const oldHtml = p.oldPrice ? `<span style="text-decoration:line-through;color:var(--sole);font-size:12px;margin-right:6px;font-weight:400;">${p.oldPrice} ₴</span>` : '';
        return `
          <a href="product.html?id=${encodeURIComponent(p.id)}" class="card">
            <button class="remove-fav" onclick="event.preventDefault(); removeFavorite('${p.id}');">×</button>
            <div class="thumb">${productThumbHTML(p)}</div>
            <div class="brand-tag">${p.brand}</div>
            <h3>${p.name}</h3>
            <div class="price">${oldHtml}${p.price} ₴</div>
          </a>`;
      }).join('')}</div>`;
    } catch (err) {
      container.innerHTML = '<p class="label">Помилка завантаження товарів.</p>';
    }
  }

  render();

  // ===== Банери (якщо адмін додав для цієї сторінки) =====
  let bannerIndex_favorites = 0;
  async function loadBanners_favorites() {
    try {
      const res = await fetch('site-content.json?_=' + Date.now());
      const data = await res.json();
      const banners = (data.banners || []).filter(b => b.enabled !== false && b.pages && b.pages.includes('favorites'));
      if (banners.length === 0) return;

      const carousel = document.getElementById('bannerCarousel');
      const track = document.getElementById('bannerTrack');
      const dots = document.getElementById('bannerDots');
      if (!carousel) return;

      track.innerHTML = banners.map(b => {
        const inner = `<img src="${b.imageUrl}" alt="${b.title || ''}">${b.title ? `<div class="banner-title">${b.title}</div>` : ''}`;
        return b.link ? `<a href="${b.link}" class="banner-slide">${inner}</a>` : `<div class="banner-slide">${inner}</div>`;
      }).join('');

      if (banners.length > 1) {
        dots.innerHTML = banners.map((_, i) => `<button data-i="${i}" class="${i === 0 ? 'active' : ''}"></button>`).join('');
        dots.querySelectorAll('button').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = parseInt(btn.dataset.i);
            bannerIndex_favorites = idx;
            track.style.transform = `translateX(-${idx * 100}%)`;
            dots.querySelectorAll('button').forEach((b, i) => b.classList.toggle('active', i === idx));
          });
        });
        setInterval(() => {
          bannerIndex_favorites = (bannerIndex_favorites + 1) % banners.length;
          track.style.transform = `translateX(-${bannerIndex_favorites * 100}%)`;
          dots.querySelectorAll('button').forEach((b, i) => b.classList.toggle('active', i === bannerIndex_favorites));
        }, 5000);
      }

      carousel.style.display = 'block';
    } catch (err) {
      console.warn('Банери не завантажено:', err);
    }
  }
  loadBanners_favorites();


  // Підставляємо реальне посилання на Telegram-менеджера з site-content.json
  (async function() {
    try {
      const res = await fetch('site-content.json?_=' + Date.now());
      const data = await res.json();
      if (data.contacts && data.contacts.telegramHandle) {
        const tgUrl = 'https://t.me/' + data.contacts.telegramHandle;
        const managerBtn = document.getElementById('managerCtaLink');
        const footerLink = document.getElementById('footerTelegramLink');
        if (managerBtn) managerBtn.href = tgUrl;
        if (footerLink) footerLink.href = tgUrl;
      }
    } catch (err) {
      console.warn('Не вдалося завантажити Telegram-посилання:', err);
    }
  })();

</script>

</body>
</html>
